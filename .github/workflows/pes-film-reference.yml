name: PES Filmstrip destination QA
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install playwright==1.56.0
      - run: python -m playwright install chromium
      - run: python qa/film-destination.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: filmstrip-destination-evidence
          path: film-qa/
