name: PES Filmstrip reference QA
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  reference:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install playwright==1.56.0
      - run: python -m playwright install chromium
      - run: python qa/film-reference.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: film-reference
          path: film-reference/
