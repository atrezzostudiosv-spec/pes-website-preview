name: PES Home 03B cinematic QA
on:
  pull_request:
    branches: [main]
    paths: ['index.html','assets/pes-cinematic-interlude.*','qa/cinematic-destination.py','.github/workflows/pes-cinematic.yml']
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install playwright==1.56.0 Pillow
      - run: python -m playwright install --with-deps chromium webkit
      - run: python qa/cinematic-destination.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pes-cinematic-interlude-evidence
          path: cinematic-qa/
