name: PES Title Glyph Alignment QA
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['assets/pes-motion-global.js','assets/pes-editorial-motion.js','assets/pes-title-glyphs.js','qa/title-glyphs.py','.github/workflows/pes-title-glyphs.yml']
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install playwright==1.56.0
      - run: python -m playwright install --with-deps chromium webkit
      - run: python qa/title-glyphs.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: title-glyph-evidence
          path: title-glyph-qa/
