name: PES Global Motion Sitewide QA
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install playwright==1.56.0
      - run: python -m playwright install --with-deps chromium
      - run: python qa/motion-global.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pes-motion-global-evidence
          path: global-motion-qa/
