name: Hillside authorized source inventory
on:
  pull_request:
    branches: [main]
    paths: ['qa/hillside-source-audit.py','.github/workflows/hillside-source-audit.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install beautifulsoup4 Pillow
      - run: python qa/hillside-source-audit.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hillside-source-audit
          path: hillside-source-audit/
